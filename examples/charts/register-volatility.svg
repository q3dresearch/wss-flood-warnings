<text x="28.0" y="478.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Environment Agency flood-monitoring API via Internet Archive, read 2026-09-23. 55 of 57 mementos parsed; 2 could not be refetched</text>
<text x="28.0" y="491.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">and are untested, not absent. Marks are deliberately not joined: consecutive captures are a median of 31 days apart, and a line</text>
<text x="28.0" y="504.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">between them would assert a path the data cannot support.</text>
